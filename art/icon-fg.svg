<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf5d0"/><stop offset="1" stop-color="#1fb889"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a4e"/><stop offset="1" stop-color="#16202c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47e5b4"/><stop offset="1" stop-color="#3d7bff"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-10%" width="700%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <rect x="337" y="232" width="350" height="560" rx="62" fill="url(#body)"/>
    <rect x="361" y="256" width="302" height="512" rx="42" fill="#05070a"/>
    <!-- shrunk content -->
    <rect x="391" y="256" width="242" height="512" fill="url(#scr)"/>
    <rect x="411" y="300" width="202" height="104" rx="22" fill="url(#card)"/>
    <rect x="411" y="430" width="44" height="44" rx="14" fill="#ff5e6c"/>
    <rect x="469" y="440" width="120" height="12" rx="6" fill="#e9eef5"/>
    <rect x="469" y="460" width="80" height="9" rx="4.5" fill="#5d6a7c"/>
    <rect x="411" y="500" width="44" height="44" rx="14" fill="#ffb547"/>
    <rect x="469" y="510" width="100" height="12" rx="6" fill="#e9eef5"/>
    <rect x="469" y="530" width="70" height="9" rx="4.5" fill="#5d6a7c"/>
    <rect x="411" y="570" width="44" height="44" rx="14" fill="#b07cff"/>
    <rect x="469" y="580" width="110" height="12" rx="6" fill="#e9eef5"/>
    <rect x="469" y="600" width="60" height="9" rx="4.5" fill="#5d6a7c"/>
    <!-- broken line, safely in the black margin -->
    <rect x="644" y="256" width="12" height="512" fill="#fff" filter="url(#glow)"/>
    <rect x="646" y="256" width="7" height="512" fill="#fff"/>
  </g>
</svg>
